<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Revisão HTML - Conceitos Flex e Grid </title>
</head>
<body>
    <section class="titulo-secao">
        <header class="titulo">
            <a href="#logo"><h1><span>RETRO</span>GAME</h1></a>

            <h3>Com grandes poderes vem grandes responsabilidades</h3>
        </header>

            <nav> 
                <ul class="nav">
                    <a href="#inicio">Inicio</a>
                    <a href="#sobre">Sobre</a>
                </ul>
            </nav>
    </section>

    <main>
        <section class="conteudo">
            <article class="conteudo-art">
                <p>Não precisamos de um Lorem para criarmos um novo texto. A partir da nossa imaginação podemos criar coisas incríveis que não imaginamos.</p>
            </article>

            <figure class="conteudo-img" >
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzYW3ruhvmhkM1gYje4Zuw-OgMA-rNMjDQ3UR4REbU6g&s=10" alt="Imagem 1 - Ilustrativa">
                <figcaption>
                    <p>Legenda de imagem gerada por IA</p> 
                </figcaption>
            </figure>
        </section>

        <section class="galeria">
            <ul class="galeria-img">
                <figure>
                    <li>Imagem 2 - Ilustrativo</li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTaIYQT3y94L_kacVGQsfrRB6XIN_igzV4h3OvEEB2JtA&s=10" alt="Imagem Gerada por IA">
                </figure>
                <figure>
                    <li>Imagem 3 - Ilustrativo</li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShQWV8dVZyxFvczrAMZsJUGpfA_Z1lshrq_nJXAtAhBQ&s=10" alt="Imagem Gerada por IA">
                </figure>
                <figure>
                    <li>Imagem 4 - Ilustrativo</li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3huND2jvpSBO0AN6KYps3smM1dnEdv3viDDzh5G5qqw&s=10" alt="Imagem Gerada por IA">
                </figure>
            </ul>

        </section>
    </main>
    
</body>
</html>
