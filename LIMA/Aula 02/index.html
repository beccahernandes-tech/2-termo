<!DOCTYPE html>
<html lang="pt - BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favicons e Imagens</title>
    <!-- Icones Favoritos-->
</head>
<body>
    <div><h1>Imagens do Google</h1>
    <!---Tag para acrescentar imagens - img-->
    <img src="imagem/wanada.png" alt="Doutor Estranho: No multiverso da Loucura" title="Wanda" align="down"> 
    </div>

    <h2>wanda - com proporção de imagens </h2>

    <div> 
    <img src="imagem/wanada.png" alt="Wanda no multiverso da loucura "
    title="Wanda no multiversoda loucura"
    width="300px"
    height="350px"
    border-radius: 10px
    >
</div>
   <h2>Wanda - com proporção de imagem com style</h2>
<div>
    <img src="imagem/wanada.png" 
    alt="Um filme incrivel!"
    title="Multiverso da Loucura"
    style=
    "margin: 20px;
    background-image: url();
    background-size: cover;
    background-repeat: repeat-x;
    width:300px;
    height:300px;"
    >
</div>
</body>
