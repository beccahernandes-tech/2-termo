<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>FactoryConnect - Portal de Gestão Industrial</title>
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .painel {
            background: linear-gradient(120deg, #286d8f, #5390a8);
            border-radius: 18px;
            color: white;
        }

        .area {
            background-color: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            text-align: center;
            padding: 15px;
        }

        .area .btn {
            background-color: #397c99;
            border: 1px solid #6096ad;
            color: white;
        }

        .area .btn:hover {
            background-color: #245c76;
            color: white;
        }
    </style>
</head>

<body>

    <main class="container py-5">
        <section class="painel p-4 p-md-5">
            <header class="mb-4">
                <h1 class="h4 fw-bold">
                    FactoryConnect - Portal de Gestão Industrial
                </h1>
                <p class="mb-0">
                    Uma indústria está digitalizando seus processos e contratou
                    a DevSolutions para criar uma interface Web responsiva
                    que centralize informações das principais áreas.
                </p>
            </header>
            <div class="row g-4">

                <section class="col-12 col-md-6 col-lg-4">
                    <article class="area h-100">
                        <button class="btn px-3 py-2">
                            Produção
                        </button>
                    </article>
                </section>
                <section class="col-12 col-md-6 col-lg-4">
                    <article class="area h-100">
                        <button class="btn px-3 py-2">
                            Manutenção
                        </button>
                    </article>
                </section>
                <section class="col-12 col-md-6 col-lg-4">
                    <article class="area h-100">
                        <button class="btn px-3 py-2">
                            Qualidade
                        </button>
                    </article>
                </section>
                <section class="col-12 col-md-6 col-lg-4">
                    <div class="area h-100">
                        <button class="btn px-3 py-2">
                            Logística
                        </button>
                    </div>
                </section>
                <article class="col-12 col-md-6 col-lg-4">
                    <div class="area h-100">
                        <button class="btn px-3 py-2">
                            Segurança
                        </button>
                    </div>
                </article>
                <article class="col-12 col-md-6 col-lg-4">
                    <div class="area h-100">
                        <button class="btn px-3 py-2">
                            Tecnologia
                        </button>
                    </div>
                </article>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
